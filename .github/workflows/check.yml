name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo run -p rust-auto-updator --example native-smoke --features smoke-test --locked -- --test-updater

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  source-release:
    name: Publish the verified source distribution
    needs: [windows, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: source-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage the tested source archive and checksum
        shell: pwsh
        run: ./scripts/stage-localization-source-release.ps1
      - name: Publish only the complete verified source distribution
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-localization-release.cjs');
            await publish({github, context, core});
