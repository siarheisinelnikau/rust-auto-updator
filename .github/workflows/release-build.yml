name: Checked release builds
'on':
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: rustfmt, clippy
        toolchain: stable
    - run: cargo fmt --all --check
    - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - run: cargo test --workspace --all-features --locked
    - run: cargo run -p rust-auto-updator --example native-smoke --features smoke-test --locked -- --test-updater
    permissions:
      contents: read
    timeout-minutes: 30
  linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: rustfmt, clippy
        toolchain: stable
    - run: cargo fmt --all --check
    - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - run: cargo test --workspace --all-features --locked
    permissions:
      contents: read
    timeout-minutes: 30
  package:
    needs:
    - windows
    - linux
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Archive the checked source revision
      shell: pwsh
      run: ./scripts/package.ps1
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: RustAutoUpdator-source
        path: dist/*
        if-no-files-found: error
        retention-days: 14
    permissions:
      contents: read
    timeout-minutes: 30
