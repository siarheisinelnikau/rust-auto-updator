[workspace]
members = ["crates/rust-auto-updator", "crates/rust-auto-updator-egui"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/siarheisinelnikau/rust-auto-updator"

# Source distribution and crate versions advance together for Debian support.
[workspace.metadata.release]
version = "0.3.1"

[workspace.dependencies]
rust-auto-updator = { version = "0.3.1", path = "crates/rust-auto-updator" }
egui = { version = "=0.37.0", default-features = false }
