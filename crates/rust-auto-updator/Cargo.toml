[package]
name = "rust-auto-updator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UI-independent GitHub release updates for portable Windows Rust applications"
readme = "README.md"

[features]
smoke-test = []

[dependencies]
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
ureq = { version = "=3.5.0", default-features = false, features = ["native-tls-no-default"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
